name: Create v0.2.0 Research Release

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/release-v0.2.0"

permissions:
  contents: write

jobs:
  verify-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install build twine

      - name: Verify version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = project["project"]["version"]
          if version != "0.2.0":
              raise SystemExit(f"Expected 0.2.0, found {version}")
          print(f"Verified version: {version}")
          PY

      - name: Lint
        run: ruff check src tests scripts app.py

      - name: Test
        run: python -m pytest -q

      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists."
          else
            gh release create v0.2.0               --target "${GITHUB_SHA}"               --title "v0.2.0 — Professional Public Research Atlas"               --notes-file RELEASE_NOTES.md               dist/*
          fi
