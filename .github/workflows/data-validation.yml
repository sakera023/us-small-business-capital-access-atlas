name: Public Data Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "src/capital_access_atlas/census_cbp.py"
      - "src/capital_access_atlas/cdfi.py"
      - "src/capital_access_atlas/analysis.py"
      - "src/capital_access_atlas/indicators.py"
      - "scripts/run_cbp_validation.py"
      - "scripts/run_cdfi_validation.py"
      - "scripts/run_index_robustness.py"

permissions:
  contents: read

jobs:
  census-cbp-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run state and county validation
        run: python scripts/run_cbp_validation.py

      - name: Validate current Certified CDFI data
        run: python scripts/run_cdfi_validation.py

      - name: Run index robustness benchmark
        run: python scripts/run_index_robustness.py

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: atlas-public-data-validation
          path: validation/
