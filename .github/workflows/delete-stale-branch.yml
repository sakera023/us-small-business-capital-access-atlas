name: Delete stale merged branch

on:
  push:
    paths:
      - ".github/branch-cleanup-trigger"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged working branch if it still exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/resolve-open-research-issues" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/resolve-open-research-issues"
            echo "Deleted resolve-open-research-issues."
          else
            echo "Branch already absent."
          fi
