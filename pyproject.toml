[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "us-small-business-capital-access-atlas"
version = "0.3.0"
description = "Open-source geospatial research tools for U.S. small-business capital-access analysis using authoritative public data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sakera Begum" }]
keywords = [
  "small-business",
  "capital-access",
  "economic-development",
  "entrepreneurship",
  "geospatial-analysis",
  "public-data",
  "sba",
  "data-science",
  "streamlit",
  "responsible-ai",
  "census",
  "county-business-patterns",
  "research-software",
  "geographic-inequality"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<4",
  "plotly>=5.20,<8",
  "streamlit>=1.40,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1"
]

[project.urls]
Homepage = "https://github.com/sakera023/us-small-business-capital-access-atlas"
Demo = "https://capital-access-atlas-sakera.streamlit.app/"
Repository = "https://github.com/sakera023/us-small-business-capital-access-atlas"
PyPI = "https://pypi.org/project/us-small-business-capital-access-atlas/"
Issues = "https://github.com/sakera023/us-small-business-capital-access-atlas/issues"
Documentation = "https://github.com/sakera023/us-small-business-capital-access-atlas/tree/main/docs"
"Data Source" = "https://data.sba.gov/dataset/state-small-business-statistics-2025"
"Census CBP" = "https://www.census.gov/data/datasets/2023/econ/cbp/2023-cbp.html"
"Citation" = "https://github.com/sakera023/us-small-business-capital-access-atlas/blob/main/CITATION.md"
"Google Scholar" = "https://scholar.google.com/citations?user=D4t4wxAAAAAJ"

[tool.setuptools.packages.find]
where = ["src"]
include = ["capital_access_atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["capital_access_atlas"]
